<!DOCTYPE html>
<html>
    <body style="background-color: burlywood;">
         <h1 style="background-color: bisque;" style="text-align: center;"><strong>Border for an Image</strong></h1>
        <img id="photo" src="girl.jpg" width="500" height="500" alt="image of a girl">
        <br>
        <br>
        <button id="addBorderBtn" style="background-color: bisque">
            Add Border
        </button>
    <script>
        document.getElementById("addBorderBtn").addEventListener("click",function(){
            const image=document.getElementById("photo")
            image.style.border="50px solid red"
        })
    </script>
    </body>
</html>
